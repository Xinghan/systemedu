<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="28" fill="#0c1927"/><g font-family="PingFang SC, sans-serif"><text x="64" y="74" fill="#edf2f6" font-size="42" text-anchor="start">都是恒星，能分辨的细节却不同</text><text x="64" y="121" fill="#a8becd" font-size="24" text-anchor="start">观察方式示意 · 不按距离或大小比例绘制</text><path d="M700,180L700,670" fill="none" stroke="#294353" stroke-width="2"/><text x="345" y="217" fill="#ffc473" font-size="36" text-anchor="middle">太阳</text><text x="1040" y="217" fill="#8ee1d3" font-size="36" text-anchor="middle">Kepler-10</text><circle cx="345" cy="380" r="114" fill="#ffc473"/><circle cx="309" cy="359" r="13" fill="#ad692d"/><circle cx="379" cy="408" r="20" fill="#ad692d"/><circle cx="387" cy="396" r="7" fill="#704121"/><circle cx="1040" cy="380" r="24" fill="#1c3d4d"/><circle cx="1040" cy="380" r="9" fill="#edf2f6"/><text x="345" y="564" fill="#edf2f6" font-size="28" text-anchor="middle">专用太阳仪器可以分辨圆面</text><text x="345" y="610" fill="#a8becd" font-size="27" text-anchor="middle">比较不同位置的表面区域</text><text x="1040" y="564" fill="#edf2f6" font-size="28" text-anchor="middle">本课不能拍清星面与旁边行星</text><text x="1040" y="610" fill="#a8becd" font-size="27" text-anchor="middle">记录每个时刻收到的光量</text><text x="64" y="716" fill="#ffc473" font-size="25" text-anchor="start">使用已有图像学习；不要直接用眼睛或普通望远镜看太阳。</text></g></svg>