<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" rx="28" fill="#0c1927"/><g font-family="PingFang SC, sans-serif"><text x="64" y="74" fill="#edf2f6" font-size="40" text-anchor="start">凌星：挡住的是通向观察者的一部分光</text><text x="64" y="122" fill="#a8becd" font-size="25" text-anchor="start">观察者方向固定 · 上方为视线投影示意，黑色圆是行星</text><circle cx="270" cy="290" r="71" fill="#ffc473"/><circle cx="160" cy="290" r="14" fill="#0c1927" stroke="#7892a4" stroke-width="2"/><text x="270" y="402" fill="#edf2f6" font-size="28" text-anchor="middle">经过前</text><circle cx="700" cy="290" r="71" fill="#ffc473"/><circle cx="700" cy="290" r="14" fill="#0c1927" stroke="#7892a4" stroke-width="2"/><text x="700" y="402" fill="#edf2f6" font-size="28" text-anchor="middle">经过中</text><circle cx="1130" cy="290" r="71" fill="#ffc473"/><circle cx="1240" cy="290" r="14" fill="#0c1927" stroke="#7892a4" stroke-width="2"/><text x="1130" y="402" fill="#edf2f6" font-size="28" text-anchor="middle">经过后</text><text x="64" y="458" fill="#a8becd" font-size="25" text-anchor="start">模拟读数</text><path d="M165,495L165,655" fill="none" stroke="#a8becd" stroke-width="2"/><path d="M165,655L1240,655" fill="none" stroke="#a8becd" stroke-width="2"/><path d="M165,500L1240,500" fill="none" stroke="#294353" stroke-width="2"/><path d="M165,610L1240,610" fill="none" stroke="#294353" stroke-width="2"/><text x="145" y="510" fill="#edf2f6" font-size="24" text-anchor="end">100</text><text x="145" y="620" fill="#edf2f6" font-size="24" text-anchor="end">96</text><circle cx="270" cy="500" r="8" fill="#8ee1d3"/><text x="270" y="692" fill="#edf2f6" font-size="24" text-anchor="middle">0 秒</text><circle cx="700" cy="610" r="8" fill="#8ee1d3"/><text x="700" y="692" fill="#edf2f6" font-size="24" text-anchor="middle">1 秒</text><circle cx="1130" cy="500" r="8" fill="#8ee1d3"/><text x="1130" y="692" fill="#edf2f6" font-size="24" text-anchor="middle">2 秒</text><text x="64" y="737" fill="#ffc473" font-size="24" text-anchor="start">构造教学例：下降幅度被放大；这不是 Kepler-10 的实测光变曲线。</text></g></svg>