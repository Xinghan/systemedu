<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880"><rect width="1200" height="880" fill="#faf9f5"/><style>text{font-family:system-ui,sans-serif;fill:#27342d}.small{font-size:17px}.title{font-size:30px;font-weight:600}.label{font-size:21px}.dim{fill:none;stroke:#69846e;stroke-width:1.5}.net{fill:none;stroke-width:3;stroke-linejoin:round}</style><text x="60" y="65" class="title">Pico + DRV8833 / 端子连接图</text><text x="60" y="101" class="small">按信号名称核对，不表示焊盘的物理排列。断开全部电源后接线；首次测试架空。</text><rect x="70" y="170" width="250" height="270" rx="10" fill="#dae4d7" stroke="#acac95"/><text x="86" y="204" class="label">Pico H / 原版 Pico</text><rect x="600" y="170" width="260" height="270" rx="10" fill="#ead7c1" stroke="#acac95"/><text x="616" y="204" class="label">Pololu DRV8833 #2130</text><rect x="930" y="205" width="210" height="70" rx="10" fill="#dddcd3" stroke="#acac95"/><text x="946" y="239" class="label">左电机 A</text><rect x="930" y="335" width="210" height="70" rx="10" fill="#dddcd3" stroke="#acac95"/><text x="946" y="369" class="label">右电机 B</text><rect x="70" y="580" width="250" height="120" rx="10" fill="#e5dfcc" stroke="#acac95"/><text x="86" y="614" class="label">常闭触碰开关 × 2</text><rect x="600" y="580" width="400" height="120" rx="10" fill="#e5dfcc" stroke="#acac95"/><text x="616" y="614" class="label">4 × AA 电池盒 + 独立开关</text><path class="net" stroke="#608374" d="M320 247H600"/><text x="88" y="253" class="small">GP2（物理脚 4）</text><text x="624" y="253" class="small">AIN1</text><circle cx="320" cy="247" r="4" fill="#608374"/><path class="net" stroke="#608374" d="M320 287H600"/><text x="88" y="293" class="small">GP3（物理脚 5）</text><text x="624" y="293" class="small">AIN2</text><circle cx="320" cy="287" r="4" fill="#608374"/><path class="net" stroke="#608374" d="M320 327H600"/><text x="88" y="333" class="small">GP4（物理脚 6）</text><text x="624" y="333" class="small">BIN1</text><circle cx="320" cy="327" r="4" fill="#608374"/><path class="net" stroke="#608374" d="M320 367H600"/><text x="88" y="373" class="small">GP5（物理脚 7）</text><text x="624" y="373" class="small">BIN2</text><circle cx="320" cy="367" r="4" fill="#608374"/><path class="net" stroke="#ba865a" d="M860 245H930M860 260H930M860 365H930M860 380H930"/><text x="873" y="228" class="small">AOUT</text><text x="873" y="348" class="small">BOUT</text><path class="net" stroke="#cb7557" d="M760 580V465H805V440"/><text x="790" y="513" class="small">正极 → 开关 → VIN</text><path class="net" stroke="#3a4744" d="M175 440V515H655V440M640 580V515M175 580V515"/><text x="225" y="506" class="small">共同 GND：电池负极、Pico GND、驱动板 GND</text><path class="net" stroke="#8b86a5" d="M110 440V545H110V580M135 440V556H145V580"/><text x="88" y="642" class="small">NC → GP10 / GP11</text><text x="88" y="678" class="small">COM → GND；NO 不接</text><path class="net" stroke="#6382a0" d="M195 170V128"/><text x="225" y="148" class="small">独立 USB 供电</text><text x="620" y="642" class="small">正极 → 独立开关 → 驱动板 VIN</text><text x="620" y="678" class="small">负极 → 共同 GND；与 USB 正极隔离</text><text x="60" y="728" class="small">Pico 端子补充：GP10 = 物理脚 14；GP11 = 脚 15；GND 示例 = 物理脚 3。</text><path d="M60 745H1140" stroke="#d8d1bf"/><text x="60" y="785" class="label">禁止将电机电源正极接进 GPIO / 3V3。驱动板不从 GPIO 取电。</text><text x="60" y="823" class="small">开关松开时 COM—NC 导通；按下或断线时输入变高，程序撤销 PWM。SLP 按指定驱动板原厂拉高配置。</text></svg>