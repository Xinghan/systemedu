<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>肌电义肢手 / Myoelectric Hand</title>
<style>
  :root{
    /* deep space base — shared canvas */
    --bg-0: oklch(0.14 0.035 265);
    --bg-1: oklch(0.18 0.04 265);
    --bg-2: oklch(0.22 0.045 265);
    --bg-3: oklch(0.28 0.05 265);
    --line: oklch(0.35 0.05 265 / 0.35);
    --line-strong: oklch(0.55 0.08 265 / 0.55);
    --fg: oklch(0.96 0.01 265);
    --fg-dim: oklch(0.75 0.02 265);
    --fg-mute: oklch(0.55 0.03 265);
    --gold: oklch(0.85 0.14 85);
    /* ROB-10 Living Prosthesis palette */
    --myo:    oklch(0.70 0.17 20);   /* muscle red — EMG signal / effort */
    --sinew:  oklch(0.78 0.13 45);   /* tendon orange — hand structure */
    --neural: oklch(0.72 0.14 230);  /* neural blue — UI / servo command */
    --force:  oklch(0.80 0.15 140);  /* force green — measured grip / safe window */
    --dawn:   oklch(0.93 0.05 45);   /* highlight text */
    /* functional semantic (allowed exceptions) */
    --crush:  oklch(0.60 0.20 25);   /* crushed red */
    --warnc:  oklch(0.80 0.15 85);   /* over-threshold amber */
    --mono: 'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-0); color:var(--fg);
    font-family:var(--sans);
    width:100vw; height:100vh; overflow:hidden;
    display:flex;
  }
  .hidden{display:none !important;}

  /* ---------- left sidebar 200px ---------- */
  .game-sidebar{
    width:200px; flex:0 0 200px; height:100%;
    background:var(--bg-1);
    border-right:1.5px solid var(--line-strong);
    display:flex; flex-direction:column;
    padding:14px 13px; gap:12px; overflow-y:auto;
  }
  .brand{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--fg-mute); line-height:1.4;}
  .brand b{display:block; color:var(--myo); font-size:13px; letter-spacing:.04em;}
  #langBtn{
    font-family:var(--mono); font-size:11px; cursor:pointer;
    background:var(--bg-3); color:var(--fg); border:1.5px solid var(--line-strong);
    padding:5px 9px; box-shadow:3px 3px 0 var(--bg-0); align-self:flex-start;
  }
  #langBtn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--bg-0);}
  .side-h{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--myo); text-transform:uppercase; margin-bottom:5px;}
  .road{display:flex; flex-direction:column; font-size:10.5px;}
  .road-step{display:flex; align-items:center; gap:6px; padding:3px 0; color:var(--fg-mute); line-height:1.25;}
  .road-dot{width:9px; height:9px; flex:0 0 9px; border:1.5px solid var(--line-strong); background:transparent;}
  .road-step.done .road-dot{background:var(--sinew); border-color:var(--sinew);}
  .road-step.now{color:var(--fg);}
  .road-step.now .road-dot{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px oklch(0.85 0.14 85 / .25);}
  .road-line{width:1.5px; height:8px; margin-left:3.5px; background:var(--line);}
  .task{background:var(--bg-2); border:1.5px solid var(--line); padding:9px 9px; font-size:11px; line-height:1.5; color:var(--fg-dim);}
  .task b{color:var(--gold);}
  .guide{font-size:10.5px; line-height:1.55; color:var(--fg-mute);}
  .guide b{color:var(--fg-dim);}
  .guide .why{margin-top:6px; padding:6px 7px; background:var(--bg-2); border-left:2px solid var(--myo); color:var(--fg-mute); display:block;}
  .endmark{margin-top:auto; font-size:9.5px; color:var(--fg-mute); line-height:1.5; border-top:1px solid var(--line); padding-top:8px; font-family:var(--mono);}
  .endmark span{color:var(--myo);}

  /* ---------- right main ---------- */
  .game-main{flex:1; height:100%; display:flex; flex-direction:column; min-width:0; padding:12px 14px; gap:10px;}
  .hud{display:flex; align-items:stretch; gap:10px; flex:0 0 auto;}
  .hud-title{flex:1; min-width:0;}
  .hud-title h1{font-size:17px; letter-spacing:.01em;}
  .hud-title h1 small{font-family:var(--mono); font-size:11px; color:var(--fg-mute); letter-spacing:.02em; margin-left:8px;}
  .hud-read{font-size:11.5px; color:var(--fg-dim); margin-top:3px; line-height:1.4;}
  .goal-chip{flex:0 0 auto; align-self:center; display:flex; gap:8px;}
  .chip{font-family:var(--mono); font-size:10px; padding:5px 8px; border:1.5px solid var(--line-strong); background:var(--bg-2); color:var(--fg-dim); display:flex; flex-direction:column; gap:2px; min-width:80px;}
  .chip .ck{color:var(--fg-mute); font-size:9px; letter-spacing:.05em;}
  .chip .cv{font-size:12px; color:var(--fg);}
  .chip.ok{border-color:var(--force); background:oklch(0.80 0.15 140 / .08);}
  .chip.ok .cv{color:var(--force);}
  .chip.hot{border-color:var(--myo); background:oklch(0.70 0.17 20 / .1);}
  .chip.hot .cv{color:var(--myo);}

  .stage{flex:1; min-height:0; display:flex; gap:12px; position:relative;}
  .panel{background:var(--bg-1); border:1.5px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0;}
  .panel-h{font-family:var(--mono); font-size:10px; letter-spacing:.07em; color:var(--neural); text-transform:uppercase; padding:7px 10px; border-bottom:1px solid var(--line); flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .panel-b{flex:1; min-height:0; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}

  .btn{
    font-family:var(--mono); font-size:11px; cursor:pointer;
    background:var(--bg-3); color:var(--fg); border:1.5px solid var(--line-strong);
    padding:6px 12px; box-shadow:3px 3px 0 var(--bg-0);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--bg-0);}
  .btn.primary{background:var(--neural); border-color:var(--dawn); color:var(--bg-0);}
  .btn.gold{background:oklch(0.85 0.14 85 / .15); border-color:var(--gold); color:var(--gold);}
  .btn.myo{background:oklch(0.70 0.17 20 / .18); border-color:var(--myo); color:var(--myo);}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 var(--bg-0);}
  .btn.small{font-size:10px; padding:4px 8px; box-shadow:2px 2px 0 var(--bg-0);}

  /* clench button (big, held) */
  .clench-btn{
    font-family:var(--mono); font-size:12px; cursor:pointer; user-select:none;
    background:var(--bg-3); color:var(--fg-dim); border:1.5px solid var(--line-strong);
    padding:10px 14px; box-shadow:3px 3px 0 var(--bg-0); text-align:center; line-height:1.3;
  }
  .clench-btn.active{background:oklch(0.70 0.17 20 / .3); border-color:var(--myo); color:var(--dawn); box-shadow:1px 1px 0 var(--bg-0); transform:translate(2px,2px);}

  /* pipeline slot cards */
  .pipe-flow{display:flex; align-items:stretch; gap:6px; flex-wrap:wrap;}
  .pipe-slot{flex:1; min-width:96px; border:1.5px dashed var(--line-strong); background:var(--bg-2); padding:8px; display:flex; flex-direction:column; gap:4px; cursor:pointer; min-height:64px; justify-content:center;}
  .pipe-slot.filled{border-style:solid; border-color:var(--sinew); background:oklch(0.78 0.13 45/.1);}
  .pipe-slot .pk{font-family:var(--mono); font-size:10.5px; color:var(--fg); display:flex; justify-content:space-between; align-items:center;}
  .pipe-slot.filled .pk{color:var(--sinew);}
  .pipe-slot .pf{font-family:var(--mono); font-size:8.5px; color:var(--fg-mute); line-height:1.45; white-space:pre-wrap;}
  .pipe-arrow{align-self:center; color:var(--fg-mute); font-family:var(--mono); font-size:14px;}

  input[type=range]{width:100%; accent-color:var(--neural);}
  .rng-row{display:flex; align-items:center; gap:8px;}
  .rng-row label{font-family:var(--mono); font-size:9.5px; color:var(--fg-mute); flex:0 0 auto; min-width:52px;}
  .rng-row .rv{font-family:var(--mono); font-size:10px; color:var(--neural); flex:0 0 auto; min-width:38px; text-align:right;}

  .toggle{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .toggle button{font-family:var(--mono); font-size:10px; padding:4px 10px; border:1.5px solid var(--line); background:var(--bg-3); color:var(--fg-mute); cursor:pointer;}
  .toggle button.on{border-color:var(--neural); color:var(--neural); background:oklch(0.72 0.14 230/.12);}

  /* signal strength bar */
  .strength-wrap{display:flex; flex-direction:column; gap:4px;}
  .strength-bar{height:26px; background:var(--bg-2); border:1.5px solid var(--line-strong); position:relative; overflow:hidden;}
  .strength-fill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, var(--myo), var(--sinew)); width:0%; transition:width .05s linear;}
  .strength-lbl{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:11px; color:var(--dawn); z-index:2;}
  .strength-raw{position:absolute; left:6px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:9px; color:var(--warnc); z-index:2;}

  /* generic canvas host */
  .cv-host{flex:1; min-height:0; display:flex; flex-direction:column; padding:5px;}
  .cv-host canvas{flex:1; min-height:0; width:100%;}
  .scope-cap{font-family:var(--mono); font-size:9px; color:var(--fg-mute); padding:4px 8px; border-top:1px solid var(--line); line-height:1.5; flex:0 0 auto;}

  /* forearm electrode column (ch1) */
  .elec-list{display:flex; flex-direction:column; gap:6px;}
  .elec-item{border:1.5px solid var(--line); background:var(--bg-2); padding:6px 8px; display:flex; align-items:center; gap:8px; cursor:pointer;}
  .elec-item.sel{border-color:var(--gold);}
  .elec-item .ed{width:14px;height:14px;flex:0 0 14px;border:1.5px solid var(--line-strong);}
  .elec-item.signal .ed{background:var(--myo);border-color:var(--myo);}
  .elec-item.ref .ed{background:var(--neural);border-color:var(--neural);}
  .elec-item.gnd .ed{background:var(--fg-mute);border-color:var(--fg-mute);}
  .elec-item .en{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);}
  .elec-item .es{font-family:var(--mono);font-size:9px;margin-left:auto;}

  /* metrics cells */
  .metrics-row{display:flex; gap:7px; flex-wrap:wrap;}
  .m-cell{flex:1; background:var(--bg-2); border:1.5px solid var(--line); padding:7px 8px; text-align:center; min-width:70px;}
  .m-cell .mk{font-family:var(--mono); font-size:8.5px; color:var(--fg-mute); letter-spacing:.04em;}
  .m-cell .mv{font-family:var(--mono); font-size:17px; margin-top:2px;}
  .m-cell.good .mv{color:var(--force);}
  .m-cell.bad .mv{color:var(--crush);}
  .m-cell.hl .mv{color:var(--neural);}

  /* intent lamp */
  .lamp{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1.5px solid var(--line-strong); background:var(--bg-2);}
  .lamp .dot{width:18px;height:18px;border-radius:50%;background:var(--bg-3);border:1.5px solid var(--line-strong);}
  .lamp.clench{border-color:var(--myo);} .lamp.clench .dot{background:var(--myo);box-shadow:0 0 12px var(--myo);}
  .lamp .lt{font-family:var(--mono);font-size:13px;color:var(--fg);}

  /* diagnostic chip */
  .diag-chip{border:1.5px solid var(--warnc); background:oklch(0.80 0.15 85/.08); padding:8px 9px; font-size:10.5px; line-height:1.5; color:var(--fg-dim); display:flex; flex-direction:column; gap:6px;}
  .diag-chip b{color:var(--warnc); font-size:10px; font-family:var(--mono);}
  .diag-chip.info{border-color:var(--fg-mute); background:transparent;}
  .diag-chip.info b{color:var(--fg-mute);}

  /* control stage (ch4) */
  .grasp-stage{flex:1;min-height:0;display:flex;gap:12px;}
  .hand-col{flex:1.2;min-width:0;display:flex;flex-direction:column;}
  .ctrl-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .obj-pick{display:flex;gap:6px;flex-wrap:wrap;}
  .obj-btn{font-family:var(--mono);font-size:10px;padding:5px 9px;border:1.5px solid var(--line);background:var(--bg-3);color:var(--fg-mute);cursor:pointer;}
  .obj-btn.on{border-color:var(--force);color:var(--force);background:oklch(0.80 0.15 140/.1);}
  .stage-step{border:1.5px solid var(--line);background:var(--bg-2);padding:7px 9px;display:flex;flex-direction:column;gap:5px;}
  .stage-step.on{border-color:var(--neural);}
  .stage-step.done{border-color:var(--force);}
  .stage-step .sh{font-family:var(--mono);font-size:10px;color:var(--fg-dim);display:flex;justify-content:space-between;align-items:center;}
  .stage-step.done .sh{color:var(--force);}
  .force-win{font-family:var(--mono);font-size:9px;color:var(--fg-mute);line-height:1.5;}

  /* discovery / settle overlay */
  .fin-overlay{position:absolute;inset:0;background:var(--bg-0);border:1.5px solid var(--line-strong);display:flex;z-index:30;}
  .fin-vis{flex:1.3;min-width:0;display:flex;flex-direction:column;border-right:1.5px solid var(--line);}
  .fin-vis canvas{flex:1;min-height:0;width:100%;}
  .fin-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px;overflow-y:auto;}
  .fin-card{border:1.5px solid var(--line-strong);background:var(--bg-1);padding:11px 12px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;}
  .fin-card.show{opacity:1;transform:none;}
  .fin-card .ph{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--neural);text-transform:uppercase;margin-bottom:6px;}
  .fin-card .row{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;color:var(--fg-dim);gap:10px;}
  .fin-card .row .rv{font-family:var(--mono);color:var(--fg);text-align:right;}
  .fin-card .live{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--force);border:1.5px solid var(--force);padding:2px 7px;letter-spacing:.08em;}
  .fin-card .badge{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--sinew);border:1.5px solid var(--sinew);padding:3px 8px;letter-spacing:.02em;margin-top:4px;}
  .decision-log{font-size:10px;line-height:1.6;color:var(--fg-dim);}
  .decision-log .dl{display:flex;gap:6px;align-items:baseline;}
  .decision-log .dl .m{font-family:var(--mono);font-size:9px;flex:0 0 auto;}
  .decision-log .dl .ok{color:var(--force);}
  .decision-log .dl .rw{color:var(--warnc);}

  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--bg-3);border:1.5px solid var(--gold);color:var(--gold);font-family:var(--mono);font-size:11px;padding:7px 14px;z-index:60;box-shadow:4px 4px 0 var(--bg-0);opacity:0;transition:opacity .3s;pointer-events:none;max-width:70%;text-align:center;line-height:1.4;}
  .toast.show{opacity:1;}
  .toast.err{border-color:var(--crush);color:var(--crush);}
  .toast.ok{border-color:var(--force);color:var(--force);}
</style>
</head>
<body>

<aside class="game-sidebar">
  <div class="brand"><b>MYO HAND</b><span data-zh="肌电义肢手 · ROB-10" data-en="Myoelectric Hand · ROB-10">肌电义肢手 · ROB-10</span></div>
  <button id="langBtn">EN</button>
  <div>
    <div class="side-h" data-zh="项目路线" data-en="Roadmap">项目路线</div>
    <div class="road" id="roadmap"></div>
  </div>
  <div class="task" id="taskCard"></div>
  <div class="guide" id="guideCard"></div>
  <div class="endmark" id="endmark"></div>
</aside>

<main class="game-main">
  <div class="hud">
    <div class="hud-title">
      <h1><span data-zh="肌电义肢手" data-en="Myoelectric Hand">肌电义肢手</span><small>sEMG · Open Bionics · e-NABLE</small></h1>
      <div class="hud-read" id="hudRead"></div>
    </div>
    <div class="goal-chip">
      <div class="chip"><span class="ck" data-zh="阶段" data-en="PHASE">阶段</span><span class="cv" id="chipPhase">SIGNAL</span></div>
      <div class="chip hot" id="chipEmgBox"><span class="ck" data-zh="发力" data-en="EFFORT">发力</span><span class="cv" id="chipEmg">--</span></div>
      <div class="chip" id="chipForceBox"><span class="ck" data-zh="握力" data-en="GRIP">握力</span><span class="cv" id="chipForce">--</span></div>
      <div class="chip" id="chipStatBox"><span class="ck" data-zh="状态" data-en="STATUS">状态</span><span class="cv" id="chipStat">SETUP</span></div>
    </div>
  </div>

  <!-- ============ CHAPTER 1 : SIGNAL ============ -->
  <div class="stage" id="ch1">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;">
      <div class="panel" style="flex:1.1;min-height:0;">
        <div class="panel-h">
          <span data-zh="肌电示波器 · 实时波形" data-en="EMG Oscilloscope · Live">肌电示波器 · 实时波形</span>
          <span id="scopeMode" style="font-family:var(--mono);font-size:9px;color:var(--fg-mute)"></span>
        </div>
        <div class="cv-host"><canvas id="scopeCanvas"></canvas></div>
        <div class="scope-cap" id="scopeCap"></div>
      </div>
      <div class="panel" style="flex:0 0 auto;">
        <div class="panel-h"><span data-zh="信号处理链 · 组装" data-en="Signal Chain · Assemble">信号处理链 · 组装</span></div>
        <div class="panel-b" style="gap:10px;">
          <div class="pipe-flow" id="pipeFlow"></div>
          <div id="pipeCtl"></div>
          <div class="strength-wrap">
            <div style="font-family:var(--mono);font-size:9.5px;color:var(--fg-mute);" data-zh="发力强度输出" data-en="Effort Strength Output">发力强度输出</div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div><span class="strength-raw" id="strengthRaw"></span><span class="strength-lbl" id="strengthLbl">--</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel" style="flex:0 0 320px;">
      <div class="panel-h"><span data-zh="前臂电极贴放" data-en="Forearm Electrodes">前臂电极贴放</span></div>
      <div class="panel-b">
        <div class="cv-host" style="flex:0 0 200px;"><canvas id="armCanvas"></canvas></div>
        <div class="elec-list" id="elecList"></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px;">
          <span style="font-family:var(--mono);font-size:9px;color:var(--fg-mute);" data-zh="握拳:" data-en="Clench:">握拳:</span>
          <div class="clench-btn" id="clenchBtn" data-zh="按住 = 握拳" data-en="HOLD = clench">按住 = 握拳</div>
        </div>
        <button class="btn primary" id="ch1Next" disabled data-zh="进入意图决策 →" data-en="To Intent →">进入意图决策 →</button>
      </div>
    </div>
  </div>

  <!-- ============ CHAPTER 2 : INTENT ============ -->
  <div class="stage hidden" id="ch2">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;">
      <div class="panel" style="flex:1;min-height:0;">
        <div class="panel-h">
          <span data-zh="强度曲线 + 阈值决策" data-en="Strength + Threshold">强度曲线 + 阈值决策</span>
          <span id="intentLampMini" style="font-family:var(--mono);font-size:9px;"></span>
        </div>
        <div class="cv-host"><canvas id="decideCanvas"></canvas></div>
        <div class="scope-cap" id="decideCap"></div>
      </div>
    </div>
    <div class="panel" style="flex:0 0 340px;">
      <div class="panel-h"><span data-zh="决策控制台" data-en="Decision Console">决策控制台</span></div>
      <div class="panel-b" id="intentPanel"></div>
    </div>
  </div>

  <!-- ============ CHAPTER 3 : HAND ============ -->
  <div class="stage hidden" id="ch3">
    <div class="panel" style="flex:1.2;min-width:0;">
      <div class="panel-h">
        <span data-zh="腱驱动手 · 侧面" data-en="Tendon-Driven Hand">腱驱动手 · 侧面</span>
        <span id="handMode" style="font-family:var(--mono);font-size:9px;color:var(--fg-mute)"></span>
      </div>
      <div class="cv-host"><canvas id="handCanvas"></canvas></div>
      <div class="scope-cap" id="handCap"></div>
    </div>
    <div class="panel" style="flex:0 0 340px;">

/* ---------- deterministic noise primitives (same family as prior pilots) ---------- */
function hash01(x, s){ const v = Math.sin(x*127.1 + s*311.7 + 74.7)*43758.5453; return v - Math.floor(v); }
function n11(x, s){ return hash01(x, s)*2 - 1; }
function smoothstep(a, b, x){ const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function lerp(a, b, t){ return a + (b-a)*t; }

/* ---------- graspable objects: each has a real safe-force window [hold, crush] (Newtons) ---------- */

/* =====================================================================
   PURE FUNCTIONS — EMG synthesis, signal chain, decision, kinematics, PID

/* raw sEMG at sim-time t (seconds), given effort 0..1 and electrode quality.
   Physically: AC burst (high-freq carrier gated by effort) + baseline noise +
   50Hz mains. Mean ~ 0. Amplitude scaled by electrode placement quality. */
function emgRaw(t, effort, elecOk){
  const q = elecOk ? 1.0 : 0.4;              // bad placement -> weak signal
  const noiseAmp = elecOk ? 0.05 : 0.16;     // bad placement -> more noise
  const mainsAmp = elecOk ? 0.02 : 0.09;     // bad placement -> more 50Hz pickup
  // motor-unit burst: sum of a few high-freq carriers, amplitude ~ effort
  const carrier = Math.sin(2*Math.PI*90*t) + 0.7*Math.sin(2*Math.PI*140*t + 1.3)
                + 0.5*Math.sin(2*Math.PI*220*t + 2.1);
  const burst = q * effort * carrier * (0.6 + 0.4*hash01(Math.floor(t*300), 7));
  const noise = noiseAmp * n11(Math.floor(t*400), 3);
  const mains = mainsAmp * Math.sin(2*Math.PI*50*t);
  return burst + noise + mains;               // ~ [-1.5, 1.5] normalized "mV-ish"
}
function rectify(x){ return Math.abs(x); }
/* moving average of the last N samples of a buffer (up to and including last) */
function movAvg(buf, N){
  if(!buf.length) return 0;
  const n = Math.min(N, buf.length);
  let s = 0; for(let i=buf.length-n; i<buf.length; i++) s += buf[i];
  return s / n;
}
/* apply a simple 50Hz notch approximation on the raw sample stream is hard per-sample;
   we model the notch as removing the mains component from the smoothed envelope. */
function normalize(v, base, peak){
  if(base==null || peak==null || peak<=base) return clamp(v, 0, 1);
  return clamp((v - base) / (peak - base), 0, 1);
}
/* decision with threshold / hysteresis / debounce. state carries {cnt, cur}. */
function decide(strength, S){
  const st = decide._st || (decide._st = {cnt:0, cur:'RELAX'});
  let want;
  if(S.hyst.on){
    if(st.cur==='RELAX') want = strength >= S.hyst.hi ? 'CLENCH' : 'RELAX';
    else                 want = strength <= S.hyst.lo ? 'RELAX' : 'CLENCH';
  } else {
    want = strength >= S.threshold ? 'CLENCH' : 'RELAX';
  }
  // debounce: require N consecutive samples of the new state
  if(want !== st.cur){
    st.cnt++;
    if(st.cnt >= S.debounceN){ st.cur = want; st.cnt = 0; }
  } else st.cnt = 0;
  return st.cur;
}
function decideReset(){ decide._st = {cnt:0, cur:'RELAX'}; }

/* finger kinematics: tendon displacement d in [0,1] -> per-joint bend angle (rad).
   3 joints per finger; total curl proportional to d, distributed with limits. */
function fingerJoints(d){
  const curl = clamp(d, 0, 1);
  // MCP, PIP, DIP progressively bend; PIP bends most (like a real finger)
  return [curl*1.05, curl*1.45, curl*1.15]; // radians at full curl
}
/* servo angle (0..180 deg) -> tendon displacement via calibration curve (piecewise
   linear through calibration points). If uncalibrated, identity-ish default. */
function servoToTendon(angle, calib){
  const a = clamp(angle, 0, 180);
  if(!calib || calib.length < 2){ return a/180; }
  const pts = calib.slice().sort((p,q)=>p.angle-q.angle);
  if(a <= pts[0].angle) return pts[0].disp;
  if(a >= pts[pts.length-1].angle) return pts[pts.length-1].disp;
  for(let i=1;i<pts.length;i++){
    if(a <= pts[i].angle){
      const t = (a - pts[i-1].angle)/(pts[i].angle - pts[i-1].angle + 1e-9);
      return lerp(pts[i-1].disp, pts[i].disp, t);
    }
  }
  return 1;
}
/* contact force: hand closure 0..1 vs object. Force rises once closure passes the
   contact point (finger touches object surface); linear stiffness beyond. */
function contactForce(closure, obj){
  const contactAt = 1 - (obj.size/40); // bigger object -> contact earlier (smaller closure)
  const pen = closure - contactAt;
  return pen > 0 ? obj.stiffness * pen : 0;
}
/* one PID step. Returns {u, integ, prevErr}. dt in seconds. */
function pidStep(target, meas, K, integ, prevErr, dt){
  const e = target - meas;
  const di = integ + e*dt;
  const de = (e - prevErr)/dt;
  const u = K.Kp*e + K.Ki*di + K.Kd*de;
  return { u, integ:di, prevErr:e, e };
}

/* =====================================================================
   REAL-TIME SIMULATION LOOP — the heart. Advances muscle dynamics, EMG
   synthesis, signal chain, decision, hand physics, force loop each frame.
   ===================================================================== */
let simT = 0;               // sim time in seconds
const DT = 1/60;
function pushBuf(buf, v){ buf.push(v); if(buf.length>BUF) buf.shift(); }

function simStep(){
  simT += DT;
  // --- muscle effort dynamics: clench raises effort, release decays ---
  S.effortTarget = S.clenching ? 1.0 : 0.0;
  const rise = S.clenching ? 0.12 : 0.10;
  S.effort += (S.effortTarget - S.effort) * rise;
  S.effort = clamp(S.effort, 0, 1);

  // --- raw EMG sample (a few sub-samples per frame for a lively trace) ---
  const elecOk = S.electrodes.placedOk;
  const raw = emgRaw(simT, S.effort, elecOk);
  pushBuf(S.rawBuf, raw);
  // signal chain
  const rec = S.pipeline.rect ? rectify(raw) : raw;
  pushBuf(S.rectBuf, S.pipeline.rect ? rec : rectify(raw)); // rectBuf always shows rectified for display
  // smoothed envelope on the rectified stream
  const envSource = S.rectBuf;
  let sm = movAvg(envSource, S.pipeline.smooth ? S.smoothN : 1);
  // notch reduces mains residue in the envelope (approx)
  if(S.pipeline.notch) sm *= 0.92;
  pushBuf(S.smoothBuf, sm);
  // strength (normalized) — needs calibration; else raw envelope clamped
  let strength;
  if(S.pipeline.norm && S.calib.done){
    strength = normalize(sm, S.calib.base, S.calib.peak);
  } else {
    strength = clamp(sm*2.2, 0, 1); // provisional pre-normalization scaling
  }
  pushBuf(S.strengthBuf, strength);
  S._strength = strength;

  // --- chapter-specific dynamics ---
  if(S.chapter===2){
    S.intent = decide(strength, S);
    if(S.trialRunning) stepTrial(strength);
  }
  if(S.chapter===4){ stepGrasp(); }
  pushBuf(S.emgBuf, strength);
}

/* master rAF loop */
let _raf=null;
function loop(){
  simStep();
  renderLive();
  _raf = requestAnimationFrame(loop);
}
function renderLive(){
  // update HUD chips
  $('chipEmg').textContent = Math.round((S._strength||0)*100)+'%';
  if(S.chapter===4){ $('chipForce').textContent = S.force.toFixed(1)+'N'; $('chipForceBox').classList.remove('hidden'); }
  else { $('chipForce').textContent='--'; }
  // draw current chapter's live canvas

  else if(S.chapter===2) drawCh2Live();
  else if(S.chapter===3) drawCh3Live();
  else if(S.chapter===4) drawCh4Live();
  updEndmark();
}

/* ---------- canvas sizing helper ---------- */
function fitCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  return {g,w,h};
}

function drawArm(){
  const cv=$('armCanvas'); if(!cv) return;
  const {g,w,h}=fitCanvas(cv);
  g.clearRect(0,0,w,h);
  // forearm shape (a rounded tapered limb, side view)
  g.fillStyle='oklch(0.30 0.04 40)'; g.strokeStyle=cssv('--sinew'); g.lineWidth=1.5;
  g.beginPath();
  g.moveTo(w*0.05,h*0.30); g.quadraticCurveTo(w*0.5,h*0.05, w*0.9,h*0.34);
  g.lineTo(w*0.95,h*0.5); g.quadraticCurveTo(w*0.9,h*0.68, w*0.5,h*0.72);
  g.quadraticCurveTo(w*0.2,h*0.74, w*0.05,h*0.62); g.closePath(); g.fill(); g.stroke();

  // zones
  ARM_ZONES.forEach(z=>{
    const zx=w*z.x, zy=h*z.y, zr=Math.min(w,h)*z.r;
    // is any electrode here?
    const here = ['signal','ref','gnd'].filter(k=>S.electrodes[k]===z.key);
    g.beginPath(); g.arc(zx,zy,zr,0,6.283);
    g.strokeStyle = here.length? cssv('--gold') : 'oklch(0.6 0.03 265 / .5)';
    g.lineWidth = here.length? 2 : 1; g.setLineDash(here.length?[]:[3,3]); g.stroke(); g.setLineDash([]);
    if(here.length){

        g.beginPath(); g.arc(zx+(i-1)*8, zy, 4, 0, 6.283); g.fill();

}

/* live oscilloscope for ch1 */
function drawScope(){
  const cv=$('scopeCanvas'); if(!cv) return;
  const {g,w,h}=fitCanvas(cv);
  g.clearRect(0,0,w,h);
  // grid
  g.strokeStyle='oklch(0.35 0.05 265 / 0.2)'; g.lineWidth=1;
  for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(0,h*i/4); g.lineTo(w,h*i/4); g.stroke(); }
  const mid=h*0.5;
  // decide what to show: raw always; if rectified, overlay rectified; smoothed strength line
  // raw trace (myo red), centered
  const buf=S.rawBuf; const n=buf.length;
  g.strokeStyle=cssv('--myo'); g.lineWidth=1.2; g.globalAlpha=0.85; g.beginPath();
  for(let i=0;i<n;i++){ const x=i/BUF*w; const y=mid - buf[i]*mid*0.55; i?g.lineTo(x,y):g.moveTo(x,y); }
  g.stroke(); g.globalAlpha=1;
  // rectified overlay if enabled
  if(S.pipeline.rect){
    g.strokeStyle=cssv('--sinew'); g.lineWidth=1; g.globalAlpha=0.6; g.beginPath();
    for(let i=0;i<S.rectBuf.length;i++){ const x=i/BUF*w; const y=h - S.rectBuf[i]*h*0.55; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke(); g.globalAlpha=1;
  }
  // smoothed strength (force green), scaled
  if(S.pipeline.smooth){
    g.strokeStyle=cssv('--force'); g.lineWidth=2; g.beginPath();
    for(let i=0;i<S.smoothBuf.length;i++){ const x=i/BUF*w; const y=h - S.smoothBuf[i]*h*1.1; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  }
  // zero line
  g.strokeStyle='oklch(0.55 0.03 265 / 0.4)'; g.setLineDash([4,4]); g.beginPath(); g.moveTo(0,mid); g.lineTo(w,mid); g.stroke(); g.setLineDash([]);
}

/* automated trial sequence: script a series of clench/relax targets and measure
   whether the decided intent matches ground truth. Also drives S.clenching. */
let trialSeq=null, trialIdx=0, trialTimer=0, trialTruth='RELAX', trialSettle=0;
function startTrials(){
  S.hitStats={tp:0,fp:0,fn:0,trials:0}; decideReset();
  trialSeq=[]; for(let i=0;i<20;i++){ trialSeq.push(i%2===0?'CLENCH':'RELAX'); }
  trialIdx=0; trialTimer=0; trialSettle=0; S.trialRunning=true;
  renderCh2();
}
function stepTrial(strength){
  if(!S.trialRunning) return;
  trialTruth = trialSeq[trialIdx];
  S.clenching = (trialTruth==='CLENCH');
  trialTimer += DT;
  // let the muscle + filter settle, then sample the decision at the end of each phase
  if(trialTimer >= 0.9){
    // score: does decided intent match truth?
    const ok = (S.intent===trialTruth);
    S.hitStats.trials++;
    if(ok) S.hitStats.tp++;
    else if(trialTruth==='RELAX' && S.intent==='CLENCH') { S.hitStats.fp++; S._everBadElec=S._everBadElec; }
    else if(trialTruth==='CLENCH' && S.intent==='RELAX') S.hitStats.fn++;
    trialIdx++; trialTimer=0;
    if(trialIdx>=trialSeq.length){ S.trialRunning=false; S.clenching=false; finishTrials(); }
    renderHitMetrics();
  }
}
function finishTrials(){
  const tr=tt(); const hit=S.hitStats.trials?S.hitStats.tp/S.hitStats.trials:0;
  if(hit>=0.9 && S.hyst.on) toast(tr.hit+' '+Math.round(hit*100)+'% ✓'.replace('✓','·')+' '+L('达标','pass'),'ok');
  else if(hit<0.9) toast(tr.needHit,'err');
  renderCh2();
}

/* =====================================================================
   CHAPTER 4 — GRASP (PID force loop + egg experiment) — CORE
   ===================================================================== */
function initGrasp(){
  S.ctrl.stage=0; S.force=0; S.integ=0; S.prevErr=0;
  S.result={grasped:false,crushed:false,dropped:false};
  S.hand.closure=0; S.hand.commandedAngle=0; S._smoothedCmd=0; S.lifting=false;
}
let graspActive=false;   // whether a grasp attempt is running (clench held)

/* stage map: 0 open-loop | 1 +smoothing/limit | 2 (settled) | 3 +FSR force feedback
   | 4 +P | 5 +D | 6 +I. Force loop uses a POSITION-form plant (closure set by the
   control law, NOT accumulated) so that pure-P leaves a real steady-state error
   that only the I term removes — matching the project's W50-52 pedagogy. */
function stepGrasp(){
  const obj=OBJECTS[S.object];
  const st=S.ctrl.stage;
  const emg = S._strength||0;
  const contactAt = 1 - (obj.size/40);

  if(st>=3){
    // ---- force closed-loop (position-form plant) ----
    // only actively grip while clenching; otherwise relax open.
    const gripping = S.clenching || S._demoGrip;
    const tgt = gripping ? S.ctrl.targetForce : 0;
    // gated gains per stage
    const Kp = st>=4 ? S.ctrl.Kp : 0.6;      // before P stage, a weak fixed proportional
    const Kd = st>=5 ? S.ctrl.Kd : 0;
    const Ki = st>=6 ? S.ctrl.Ki : 0;
    const e = tgt - S.force;
    // integrate only while gripping (anti-windup: clamp integral)
    if(gripping) S.integ = clamp(S.integ + e*DT, -3, 3); else S.integ = 0;
    // POSITION-form control law: commanded closure = contact point + weighted terms.
    //  P: proportional to error -> at steady state force stalls below target (Kp*e
    //     alone can't close the gap) => a real steady-state ERROR.
    //  I: integral of error accumulates and pushes closure further until e -> 0,
    //     REMOVING the steady-state error.
    //  D: damps the measured-force rate (dF/dt) -> pulls back when force rises fast,
    //     SUPPRESSING overshoot.
    const dForce = (S.force - (S._prevForce||S.force))/DT;
    S._prevForce = S.force;
    const pushP = Kp * e * 0.075;
    const pushI = Ki * S.integ * 0.075;
    const pushD = -Kd * dForce * 0.010;
    let cmd = contactAt + pushP + pushI + pushD;
    if(!gripping) cmd = 0;
    // output smoothing + rate limit (stage>=1 always on here)
    S._smoothedCmd = (S._smoothedCmd==null?cmd:lerp(S._smoothedCmd, cmd, 0.18));
    const maxStep = S.ctrl.rateLimit? 0.02 : 0.05;
    S.hand.closure = clamp(clamp(S._smoothedCmd, S.hand.closure-maxStep, S.hand.closure+maxStep), 0, 1.1);
  } else {
    // ---- open-loop: EMG strength maps directly to closure ----
    let rawCmd = emg;
    if(st>=1){
      // output smoothing + rate limit tames the jitter
      S._smoothedCmd = (S._smoothedCmd==null?rawCmd:lerp(S._smoothedCmd, rawCmd, 0.15));
      let target=clamp(S._smoothedCmd, S.hand.closure-0.02, S.hand.closure+0.02);
      S.hand.closure=clamp(target,0,1.1);
    } else {
      // raw direct drive: residual signal noise passes straight to the hand -> jitter
      const jitter = 0.06*n11(Math.floor(simT*120),9)*Math.max(emg,0.2);
      S.hand.closure = clamp(rawCmd + jitter, 0, 1.1);
      if(emg>0.3) S._everJittered=true;
    }
  }
  // contact force from closure vs object. Stages 0-2 are "drive test in the air"
  // (open-loop / smoothing) — the hand follows the muscle but is NOT gripping an
  // object yet, so no force/crush outcome. The object is only engaged once the
  // force loop is active (stage>=3).
  const gripStage = S.ctrl.stage>=3;
  S.force = gripStage ? contactForce(S.hand.closure, obj) : 0;
  pushBuf(S.forceBuf, S.force/ (obj.crush>50?8:obj.crush) ); // normalized for plotting
  pushBuf(S.angleBuf, S.hand.closure);
  // outcome checks (only while actually gripping an object)
  if(gripStage && !S.result.crushed && S.force > obj.crush){
    S.result.crushed=true; S._everCrushed=true; graspActive=false;
    toast(tt().resCrush,'err');
  }
  // settle detection: stable force in-window for a while -> grasped
  if(gripStage && !S.result.crushed){
    const inWin = S.force>=obj.hold && S.force<=obj.crush;
    if(inWin){ S._settle=(S._settle||0)+DT; } else { S._settle=0; }
    if((S._settle||0)>1.2 && !S.result.grasped){ S.result.grasped=true; onGrasped(); }
  }
}
let _graspFired=false;
/* onGrasped defined below (finale) */

function renderCh4(){
  const tr=tt();
  const host=$('graspPanel'); host.innerHTML='';
  // object picker
  const op=el('div','obj-pick');
  Object.keys(OBJECTS).forEach(k=>{
    const b=el('div','obj-btn'+(S.object===k?' on':''), OBJECTS[k][S.lang]);
    b.addEventListener('click',()=>{ S.object=k; S.result={grasped:false,crushed:false,dropped:false}; S._settle=0; _graspFired=false; S.integ=0; renderCh4(); });
    op.appendChild(b);
  });
  const opRow=el('div',''); opRow.innerHTML='<div style="font-family:var(--mono);font-size:9.5px;color:var(--fg-mute);margin-bottom:4px;">'+tr.object+'</div>'; opRow.appendChild(op);
  host.appendChild(opRow);
  // safe window readout
  const win=OBJECTS[S.object];
  host.appendChild(el('div','force-win','<span style="color:var(--force)">'+tr.forceWin+'</span>: '+win.hold.toFixed(1)+' – '+(win.crush>50?'∞':win.crush.toFixed(1))+' N'));
  // control chain stages
  tr.stages.forEach((label,i)=>{
    const active=S.ctrl.stage===i, done=S.ctrl.stage>i;
    const step=el('div','stage-step'+(active?' on':'')+(done?' done':''));
    step.innerHTML='<div class="sh"><span>'+(i+1)+' · '+label+'</span>'+(done?'<span style="color:var(--force)">✓'.replace('✓','●')+'</span>':'')+'</div>';
    if(active && i<tr.stages.length){
      const b=el('button','btn small primary', tr.stageBtns[i]);
      b.addEventListener('click',()=>{ advanceStage(i); }); step.appendChild(b);
    }
    host.appendChild(step);
  });
  // PID sliders (appear at their stages)
  if(S.ctrl.stage>=3){
    const tf=el('div','rng-row'); tf.innerHTML='<label>'+tr.targetForce+'</label>';
    const sl=el('input'); sl.type='range'; sl.min='0.3'; sl.max=(win.crush>50?'6':(win.crush+1).toFixed(1)); sl.step='0.1'; sl.value=S.ctrl.targetForce;
    sl.addEventListener('input',e=>{ S.ctrl.targetForce=+e.target.value; $('tfv').textContent=S.ctrl.targetForce.toFixed(1)+'N'; });
    tf.appendChild(sl); const v=el('span','rv',S.ctrl.targetForce.toFixed(1)+'N'); v.id='tfv'; tf.appendChild(v); host.appendChild(tf);
  }
  if(S.ctrl.stage>=4){ addGainSlider(host,'Kp',0,6,0.1); }
  if(S.ctrl.stage>=5){ addGainSlider(host,'Kd',0,3,0.05); }
  if(S.ctrl.stage>=6){ addGainSlider(host,'Ki',0,3,0.05); }
  // grasp control buttons
  const gc=el('div',''); gc.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;';
  const demo=el('button','btn myo', tr.demoRun);
  demo.addEventListener('click', runDemo);
  gc.appendChild(demo);
  host.appendChild(gc);
  // diagnostics
  const dg=el('div',''); dg.id='graspDiag'; host.appendChild(dg);
  updHud(); updEndmark();
}
function addGainSlider(host,key,min,max,step){
  const r=el('div','rng-row'); r.innerHTML='<label>'+key+'</label>';
  const sl=el('input'); sl.type='range'; sl.min=min; sl.max=max; sl.step=step; sl.value=S.ctrl[key];
  sl.addEventListener('input',e=>{ S.ctrl[key]=+e.target.value; document.getElementById(key+'v').textContent=S.ctrl[key].toFixed(2); });
  r.appendChild(sl); const v=el('span','rv',S.ctrl[key].toFixed(2)); v.id=key+'v'; r.appendChild(v); host.appendChild(r);
}
function advanceStage(i){
  const tr=tt();
  if(i===0){ S.ctrl.stage=1; }                // open-loop -> add smoothing
  else if(i===1){ S.ctrl.stage=2; S.ctrl.outSmooth=true; S.ctrl.rateLimit=true; }
  else if(i===2){ S.ctrl.stage=3; S.ctrl.force=true; }  // force feedback
  else if(i===3){ S.ctrl.stage=4; S.ctrl.Kp=2.0; }      // enable P
  else if(i===4){ S.ctrl.stage=5; S.ctrl.Kd=0.4; }      // enable D
  else if(i===5){ S.ctrl.stage=6; S.ctrl.Ki=0.4; }      // enable I
  S.integ=0; S.prevErr=0;
  renderCh4();
}
function runDemo(){
  // scripted: clench (grasp) hold, then release. drives S.clenching for a few seconds.
  let t=0; S.result={grasped:false,crushed:false,dropped:false}; S._settle=0; _graspFired=false; S.integ=0; S.force=0; S.hand.closure=0;
  const iv=setInterval(()=>{
    t+=0.1;
    S.clenching = (t<3.0);   // clench for 3s then release
    if(t>4.5){ clearInterval(iv); S.clenching=false; }
  },100);
}
function drawCh4Live(){
  const obj=OBJECTS[S.object];
  // object only engaged once the force loop is active (stage>=3); before that the
  // hand is doing a drive-test in the air.
  drawHand($('graspCanvas'), S.hand.closure, S.ctrl.stage>=3 ? obj : null);
  // right-side would be triple curve — draw as small inset on the same canvas top-right? keep hand full.
  // caption + diag
  const tr=tt();
  const inWin = S.force>=obj.hold && S.force<=obj.crush && !S.result.crushed;
  $('graspMode').textContent = 'F '+S.force.toFixed(1)+'N '+(S.result.crushed?('· '+tr.resCrush):(S.result.grasped?('· '+tr.resGrasp):(inWin?'· in-window':'')));
  $('graspCap').innerHTML='<span style="color:var(--myo)">■</span> EMG  <span style="color:var(--neural)">■</span> '+L('舵机角','angle')+'  <span style="color:var(--force)">■</span> '+L('实测握力','grip force')+'  ·  '+tr.forceWin+' '+obj.hold.toFixed(1)+'–'+(obj.crush>50?'∞':obj.crush.toFixed(1))+'N';
  // triple curve strip along the bottom of grasp canvas is drawn inside drawGraspCurves
  drawGraspCurves();
  renderGraspDiag();
}
function drawGraspCurves(){
  // draw the three synchronized curves as a translucent strip at the bottom of the hand canvas
  const cv=$('graspCanvas'); if(!cv) return;
  const dpr=window.devicePixelRatio||1; const w=cv.clientWidth, h=cv.clientHeight;
  const g=cv.getContext('2d'); // reuse context (already transformed)
  const stripH=h*0.28, y0=h-stripH;
  g.fillStyle='oklch(0.14 0.035 265 / 0.82)'; g.fillRect(0,y0,w,stripH);
  g.strokeStyle=cssv('--line'); g.lineWidth=1; g.beginPath(); g.moveTo(0,y0); g.lineTo(w,y0); g.stroke();
  const obj=OBJECTS[S.object];
  const plot=(buf,color,scale)=>{ g.strokeStyle=color; g.lineWidth=1.5; g.beginPath();
    for(let i=0;i<buf.length;i++){ const x=i/BUF*w; const yy=y0+stripH - buf[i]*scale*stripH; i?g.lineTo(x,yy):g.moveTo(x,yy); } g.stroke(); };
  plot(S.emgBuf, cssv('--myo'), 0.9);
  plot(S.angleBuf, cssv('--neural'), 0.9);
  plot(S.forceBuf, cssv('--force'), 0.9);
  // target force line + safe window band
  const fscale=1/(obj.crush>50?8:obj.crush);
  const tgtY=y0+stripH - (S.ctrl.targetForce*fscale)*0.9*stripH;
  if(S.ctrl.stage>=3){ g.strokeStyle=cssv('--force'); g.setLineDash([4,3]); g.globalAlpha=0.7; g.beginPath(); g.moveTo(0,tgtY); g.lineTo(w,tgtY); g.stroke(); g.setLineDash([]); g.globalAlpha=1; }
  // crush line
  const crushY=y0+stripH - (obj.crush*fscale)*0.9*stripH;
  if(obj.crush<50){ g.strokeStyle=cssv('--crush'); g.globalAlpha=0.5; g.setLineDash([2,3]); g.beginPath(); g.moveTo(0,crushY); g.lineTo(w,crushY); g.stroke(); g.setLineDash([]); g.globalAlpha=1; }
}
function renderGraspDiag(){
  const tr=tt(); const host=$('graspDiag'); if(!host) return;
  const obj=OBJECTS[S.object]; const out=[];
  if(S.result.crushed){ out.push('crush'); }
  else if(S._everJittered && S.ctrl.stage<2){ out.push('jitter'); }
  else if(S.ctrl.stage<3 && S.clenching && S.force>0){ out.push('noforce'); }
  else if(S.ctrl.stage>=4 && S.ctrl.Ki===0 && S.force>0 && S.force<obj.hold && S.clenching){ out.push('drop'); }
  // dedupe & render (only show most relevant one or two)
  const uniq=[...new Set(out)].slice(0,2);
  host.innerHTML = uniq.map(k=>{ const d=tr.diag[k];
    let btn = d.b? '<button class="btn small" data-fix="'+k+'" style="align-self:flex-start">'+d.b+'</button>':'';
    return '<div class="diag-chip"><b>'+tr.diagTitle+' · '+d.t+'</b>'+d.d+btn+'</div>';
  }).join('');
  host.querySelectorAll('[data-fix]').forEach(b=> b.addEventListener('click',()=> applyGraspFix(b.getAttribute('data-fix'))));
}
function applyGraspFix(k){
  if(k==='jitter'){ if(S.ctrl.stage<1) S.ctrl.stage=1; advanceStage(1); toast(tt().diag.jitter.b); }
  else if(k==='noforce'){ while(S.ctrl.stage<3) advanceStage(S.ctrl.stage); toast(tt().diag.noforce.b); }
  else if(k==='crush'){ S.result.crushed=false; S._settle=0; while(S.ctrl.stage<5) advanceStage(S.ctrl.stage); toast(tt().diag.crush.b); }
  else if(k==='drop'){ while(S.ctrl.stage<6) advanceStage(S.ctrl.stage); toast(tt().diag.drop.b); }
  renderCh4();
}

/* ---------- finale: triggered when the egg is grasped for real ---------- */
let _finaleShown=false;
function onGrasped(){
  if(_graspFired) return; _graspFired=true;
  setStat('HELD'); toast(tt().resGrasp,'ok');
  // require the hard object (egg default) & a real force loop (stage>=6 ideal, >=4 min) to celebrate
  if(!_finaleShown && S.object==='egg' && S.ctrl.stage>=4){
    _finaleShown=true;
    setTimeout(()=> showFinale(), 700);
  }
}
function showFinale(){
  const tr=tt(); const obj=OBJECTS[S.object];
  $('finOverlay').classList.remove('hidden');
  setStat('LIVE');
  drawFinaleCurve();
  const side=$('finSide'); side.innerHTML=''; const cards=[];
  // validation card
  const c1=el('div','fin-card');
  const err=Math.abs(S.ctrl.targetForce - S.force);
  c1.innerHTML='<div class="ph">'+tr.finTitle+'</div>'+
    '<div style="margin-bottom:6px;"><span class="live">● '+tr.proved+'</span></div>'+
    row(tr.fObj, obj[S.lang])+row(tr.fForce,S.force.toFixed(2)+' N')+row(tr.fTarget,S.ctrl.targetForce.toFixed(1)+' N')+
    row(tr.fErr,err.toFixed(2)+' N')+row(tr.fPID,'Kp'+S.ctrl.Kp.toFixed(1)+' Ki'+S.ctrl.Ki.toFixed(1)+' Kd'+S.ctrl.Kd.toFixed(1));
  side.appendChild(c1); cards.push(c1);
  // deliverables
  const c2=el('div','fin-card');
  c2.innerHTML='<div class="ph">'+tr.cardOut+'</div><div class="badge">'+tr.badgeRepo+'</div><br><div class="badge">'+tr.badgeCode+'</div>';
  side.appendChild(c2); cards.push(c2);
  // settlement + decision log
  const c3=el('div','fin-card');
  const hit=S.hitStats.trials?Math.round(S.hitStats.tp/S.hitStats.trials*100):100;
  c3.innerHTML='<div class="ph">'+tr.cardSettle+'</div>'+
    row(tr.fHit, hit+'%')+row(tr.fForce, S.force.toFixed(2)+' N')+row(tr.fErr, err.toFixed(2)+' N')+
    '<div class="decision-log" style="margin-top:8px;">'+decisionLog()+'</div>';
  side.appendChild(c3); cards.push(c3);
  // free mode
  const c4=el('div','fin-card');
  c4.innerHTML='<div class="ph">'+tr.freeMode+'</div><div style="font-size:10px;color:var(--fg-mute);line-height:1.5;margin-bottom:8px;">'+tr.freeHint+'</div>';
  const fr=el('div',''); fr.style.cssText='display:flex;gap:6px;flex-wrap:wrap;';
  Object.keys(OBJECTS).forEach(k=>{ const b=el('button','btn small',OBJECTS[k][S.lang]); if(k===S.object)b.classList.add('gold'); b.addEventListener('click',()=>startFreeMode(k)); fr.appendChild(b); });
  c4.appendChild(fr); side.appendChild(c4); cards.push(c4);
  cards.forEach((c,i)=> setTimeout(()=>c.classList.add('show'), 400+i*350));
  refreshShell();
}
function row(k,v){ return '<div class="row"><span>'+k+'</span><span class="rv">'+v+'</span></div>'; }
function decisionLog(){
  const tr=tt(); const out=[];
  if(!S._everBadElec) out.push(['ok',tr.logGood.elec]); else out.push(['rw',tr.logRework.elec]);
  if(!S._everJittered) out.push(['ok',tr.logGood.smooth]); else out.push(['rw',tr.logRework.jitter]);
  if(S.hyst.on) out.push(['ok',tr.logGood.hyst]);
  out.push(['ok',tr.logGood.pid]);
  if(S._everCrushed) out.push(['rw',tr.logRework.crush]);
  if(S._everDropped) out.push(['rw',tr.logRework.drop]);
  return out.map(([k,t])=>'<div class="dl"><span class="m '+(k==='ok'?'ok':'rw')+'">'+(k==='ok'?'[OK]':'[RW]')+'</span><span>'+t+'</span></div>').join('');
}
function drawFinaleCurve(){
  const cv=$('finCanvas'); if(!cv) return;
  const {g,w,h}=fitCanvas(cv);
  g.clearRect(0,0,w,h);
  g.strokeStyle='oklch(0.35 0.05 265 / 0.2)'; g.lineWidth=1;
  for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(0,h*i/4); g.lineTo(w,h*i/4); g.stroke(); }
  const obj=OBJECTS[S.object]; const fscale=1/(obj.crush>50?8:obj.crush);
  // EMG strength (myo) and measured force (green) overlaid to show the loop follows the muscle
  const plot=(buf,color,scale,lw)=>{ g.strokeStyle=color; g.lineWidth=lw||2; g.beginPath();
    for(let i=0;i<buf.length;i++){ const x=i/BUF*w; const y=h - buf[i]*scale*h*0.9 - h*0.05; i?g.lineTo(x,y):g.moveTo(x,y); } g.stroke(); };
  plot(S.emgBuf, cssv('--myo'), 0.9, 2);
  plot(S.forceBuf, cssv('--force'), 0.9, 2.4);
  // target force line
  g.strokeStyle=cssv('--force'); g.setLineDash([5,4]); g.globalAlpha=0.6;
  const ty=h - (S.ctrl.targetForce*fscale)*0.9*h - h*0.05; g.beginPath(); g.moveTo(0,ty); g.lineTo(w,ty); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
  // legend
  g.font='10px '+cssv('--mono');
  g.fillStyle=cssv('--myo'); g.fillText('■ '+tt().syncEMG, 8, 16);
  g.fillStyle=cssv('--force'); g.fillText('■ '+tt().syncForce, 8, 30);
  g.fillStyle=cssv('--fg-mute'); g.fillText('┄ '+tt().syncTarget, 8, 44);
}
function startFreeMode(k){
  S.object=k; S.freeMode=true;
  S.result={grasped:false,crushed:false,dropped:false}; S._settle=0; _graspFired=false; _finaleShown=false;
  S.integ=0; S.force=0; S.hand.closure=0;
  $('finOverlay').classList.add('hidden');
  toast(L('自由抓取: ','Free grasp: ')+OBJECTS[k][S.lang]);
  setStat('GRASP'); renderCh4();
}

/* redraw on resize */
let _rt=null;
window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ renderLive&&renderLive(); }, 120); });

/* =====================================================================
   BOOT
   ===================================================================== */
window.S=S; window.tt=tt;
window.renderCh1=renderCh1; window.renderCh2=renderCh2; window.renderCh3=renderCh3; window.renderCh4=renderCh4;
window.gotoChapter=gotoChapter; window.advanceStage=advanceStage; window.startTrials=startTrials;
window.emgRaw=emgRaw; window.rectify=rectify; window.movAvg=movAvg; window.normalize=normalize;
window.decide=decide; window.fingerJoints=fingerJoints; window.servoToTendon=servoToTendon;
window.contactForce=contactForce; window.pidStep=pidStep; window.OBJECTS=OBJECTS;
bindClench();
gotoChapter(1);
loop();
</script>
