<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Molecule Monster Hunter M64 — Scaffold Razor: shave & sort into families</title>
<style>
:root{
  --bg-0: oklch(0.14 0.035 265);
  --bg-1: oklch(0.18 0.04 265);
  --bg-2: oklch(0.22 0.045 265);
  --bg-3: oklch(0.28 0.05 265);
  --line: oklch(0.35 0.05 265 / 0.35);
  --line-strong: oklch(0.55 0.08 265 / 0.55);
  --fg:      oklch(0.96 0.01 265);
  --fg-dim:  oklch(0.75 0.02 265);
  --fg-mute: oklch(0.55 0.03 265);
  --gold:    oklch(0.85 0.14 85);

  --chem: oklch(0.82 0.17 125);
  --CATALYST: oklch(0.82 0.17 125);
  --BOND:     oklch(0.62 0.16 125);
  --DEEP:     oklch(0.35 0.10 130);
  --REACTION: oklch(0.95 0.08 120);
  --YIELD:    oklch(0.85 0.14 85);
  --GOOD: oklch(0.75 0.17 155);
  --BAD:  oklch(0.62 0.20 25);
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:var(--bg-0);color:var(--fg);
  font-family:'Noto Sans SC',system-ui,sans-serif}
.app{display:flex;height:100vh;width:100%}

/* sidebar */
.game-sidebar{width:208px;flex-shrink:0;height:100vh;
  background:linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px;padding:13px 13px 14px;overflow:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-tag{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--BOND)}
#langBtn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;
  padding:4px 9px;cursor:pointer;border:1px solid color-mix(in oklch, var(--chem) 45%, transparent);
  background:color-mix(in oklch, var(--chem) 16%, transparent);color:var(--REACTION)}
#langBtn:hover{background:color-mix(in oklch, var(--chem) 30%, transparent)}
.mascot-wrap{display:flex;align-items:center;gap:9px;padding:4px 0 2px}
.mascot-name{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--chem)}
.mascot-line{font-size:9.5px;line-height:1.4;color:var(--fg-mute)}
.side-title{font-family:var(--mono);font-weight:700;font-size:13px;line-height:1.25;color:var(--REACTION);letter-spacing:0.3px}
.side-block-label{font-family:var(--mono);font-size:8px;letter-spacing:1.4px;color:var(--chem);text-transform:uppercase;margin:4px 0 5px}
.side-goal{font-size:9.5px;line-height:1.55;color:var(--fg-dim)}
.side-goal li{margin-bottom:5px;list-style:none;padding-left:11px;position:relative}
.side-goal li::before{content:'';position:absolute;left:0;top:6px;width:4px;height:4px;background:var(--chem)}
.side-hud{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:9px}
.hud-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.hud-l{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--fg-mute);text-transform:uppercase}
.hud-v{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--chem)}

/* main */
.game-main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;position:relative;padding:14px 18px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.title-h{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--REACTION);letter-spacing:0.5px}
.prog{font-family:var(--mono);font-size:10px;color:var(--fg-dim)}
.prog b{color:var(--chem)}

.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--bg-2);border:1px solid var(--line);padding:9px 13px;margin-bottom:9px}
.ctl-group{display:flex;align-items:center;gap:8px}
.ctl-label{font-family:var(--mono);font-size:9.5px;letter-spacing:0.5px;color:var(--fg-mute);text-transform:uppercase}
.ctl-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--chem);min-width:120px}
input[type=range]{width:160px;accent-color:var(--chem);cursor:pointer}
.btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.5px;
  padding:7px 15px;cursor:pointer;border:1px solid color-mix(in oklch,var(--chem) 55%,transparent);
  background:color-mix(in oklch,var(--chem) 20%,transparent);color:var(--REACTION)}
.btn:hover{background:color-mix(in oklch,var(--chem) 35%,transparent)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn.gold{border-color:color-mix(in oklch,var(--gold) 55%,transparent);background:color-mix(in oklch,var(--gold) 18%,transparent);color:var(--gold)}

#cWrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}

.feedback{position:absolute;left:18px;bottom:14px;right:18px;
  font-size:11.5px;line-height:1.5;color:var(--fg);
  background:var(--bg-0);border:1px solid var(--line);padding:9px 13px;min-height:42px}
.feedback b{color:var(--chem)}
.feedback .ok{color:var(--GOOD);font-weight:700}
.feedback .bad{color:var(--BAD);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <aside class="game-sidebar">
    <div class="side-top">
      <span class="brand-tag" id="sideTag">CHEM · M64</span>
      <button id="langBtn">CN</button>
    </div>
    <div class="mascot-wrap">
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="6.5" fill="none" stroke="var(--chem)" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="3" fill="var(--CATALYST)"/>
        <circle cx="8" cy="13" r="2.4" fill="var(--BOND)"/>
        <circle cx="32" cy="13" r="2.4" fill="var(--BOND)"/>
        <circle cx="11" cy="31" r="2.2" fill="var(--YIELD)"/>
        <line x1="13.5" y1="17" x2="9.8" y2="14.5" stroke="var(--line-strong)" stroke-width="1.1"/>
        <line x1="26.5" y1="17" x2="30.2" y2="14.5" stroke="var(--line-strong)" stroke-width="1.1"/>
      </svg>
      <div><div class="mascot-name">ION</div><div class="mascot-line" id="mascotLine"></div></div>
    </div>
    <div class="side-title" id="sTitle"></div>
    <div>
      <div class="side-block-label" id="sGoalLabel"></div>
      <ul class="side-goal" id="sGoal"></ul>
    </div>
    <div class="side-hud">
      <div class="hud-row"><span class="hud-l" id="hL1"></span><span class="hud-v" id="hV1">0</span></div>
      <div class="hud-row"><span class="hud-l" id="hL2"></span><span class="hud-v" id="hV2">0/8</span></div>
      <div class="hud-row"><span class="hud-l" id="hL3"></span><span class="hud-v" id="hV3">--</span></div>
    </div>
  </aside>

  <main class="game-main">
    <div class="top-bar">
      <div class="title-h" id="titleH"></div>
      <div class="prog" id="progTxt"></div>
    </div>

    <div class="controls">
      <div class="ctl-group">
        <span class="ctl-label" id="pickLabel"></span>
        <input type="range" id="molSlider" min="0" max="7" step="1" value="0"/>
        <span class="ctl-val" id="molName">--</span>
      </div>
      <div class="ctl-group">
        <button class="btn" id="shaveBtn"></button>
        <button class="btn" id="benzBtn"></button>
        <button class="btn gold" id="indoBtn"></button>
      </div>
    </div>

    <div id="cWrap"><canvas id="c"></canvas></div>
    <div class="feedback" id="feedback"></div>
  </main>
</div>

<script>
(function(){
"use strict";
var LANG='zh';

/* ── RDKit-real molecule set (verified RDKit 2026.03.3 MurckoScaffold).
   8 molecules across 2 scaffold families. IDENTICAL data as the M64 animation.
   benzene scaffold c1ccccc1 (6 heavy atoms) ; indole scaffold c1ccc2[nH]ccc2c1 (9 heavy atoms) ── */
var MOLS=[
  {id:'aniline',    cn:'苯胺',     mw:93,  heavy:7,  scaf:'c1ccccc1',         scafHeavy:6, fam:'benzene', sub:'NH2',   tail:1},
  {id:'phenol',     cn:'苯酚',     mw:94,  heavy:7,  scaf:'c1ccccc1',         scafHeavy:6, fam:'benzene', sub:'OH',    tail:1},
  {id:'toluene',    cn:'甲苯',     mw:92,  heavy:7,  scaf:'c1ccccc1',         scafHeavy:6, fam:'benzene', sub:'CH3',   tail:1},
  {id:'paracetamol',cn:'对乙酰氨基酚',mw:151,heavy:11, scaf:'c1ccccc1',        scafHeavy:6, fam:'benzene', sub:'amide', tail:5},
  {id:'indole',     cn:'吲哚',     mw:117, heavy:9,  scaf:'c1ccc2[nH]ccc2c1', scafHeavy:9, fam:'indole',  sub:'none',  tail:0},
  {id:'tryptophan', cn:'色氨酸',   mw:204, heavy:15, scaf:'c1ccc2[nH]ccc2c1', scafHeavy:9, fam:'indole',  sub:'chain', tail:6},
  {id:'melatonin',  cn:'褪黑素',   mw:232, heavy:17, scaf:'c1ccc2[nH]ccc2c1', scafHeavy:9, fam:'indole',  sub:'chain', tail:8},
  {id:'naphtha',    cn:'萘',       mw:128, heavy:10, scaf:'c1ccc2ccccc2c1',   scafHeavy:10,fam:'naphtha', sub:'none',  tail:0}
];

var I18N={
  mascotLine:{en:'Shave it. Read the bones. Sort the family.',cn:'剃一剃，读骨头，分家族。'},
  sTitle:{en:'SCAFFOLD RAZOR BENCH',cn:'骨架剃刀实验台'},
  sGoalLabel:{en:'YOUR JOB',cn:'你的任务'},
  goal1:{en:'Slide to pick a molecule, then SHAVE it.',cn:'拖滑块选一个分子，再剃它。'},
  goal2:{en:'Read the scaffold SMILES the razor leaves.',cn:'读剃刀剩下的骨架 SMILES。'},
  goal3:{en:'Sort it into the family with the SAME scaffold.',cn:'把它分到骨架相同的那个家族。'},
  hL1:{en:'CORRECT',cn:'答对'},
  hL2:{en:'SORTED',cn:'已分类'},
  hL3:{en:'SCAFFOLD',cn:'当前骨架'},
  titleH:{en:'Shave the leaves → read the bone → sort by scaffold',cn:'剃枝叶 → 读骨头 → 按骨架归族'},
  pickLabel:{en:'PICK MOLECULE',cn:'选分子'},
  shaveBtn:{en:'SHAVE',cn:'剃骨架'},
  benzBtn:{en:'→ benzene fam',cn:'→ 苯环族'},
  indoBtn:{en:'→ indole fam',cn:'→ 吲哚族'},
  prog:{en:'sorted',cn:'已分类'},
  fbStart:{en:'Pick a molecule with the slider, then press SHAVE to strip its side-chains down to the core ring scaffold.',
           cn:'用滑块选一个分子，再按「剃骨架」把它的侧链剥到只剩核心环骨架。'},
  fbShaved:{en:'Shaved! __NAME__ (__H__ atoms) → scaffold __SCAF__ (__SH__ atoms). Now sort it: which family shares THIS exact scaffold?',
            cn:'剃好了！__NAME__（__H__ 原子）→ 骨架 __SCAF__（__SH__ 原子）。现在归族：哪个家族顶着这个一模一样的骨架？'},
  fbSortFirst:{en:'Shave it first — you must see the scaffold before you can sort by it.',cn:'先剃骨架——得先看到骨架，才能按骨架归族。'},
  fbRight:{en:'Correct. __NAME__ -> __SCAF__ matches the __FAM__ family — scaffold SMILES strings are EQUAL, so they are one family.',
           cn:'答对。__NAME__ -> __SCAF__ 归入__FAM__——骨架 SMILES 字符串完全相等，所以是一家子。'},
  fbWrong:{en:'Not that family. __NAME__ shaves to __SCAF__, but that pile shares a DIFFERENT scaffold. Compare the strings: equal = same family.',
           cn:'不是那一家。__NAME__ 剃出来是 __SCAF__，可那一堆顶的是另一个骨架。比字符串：相等才同一家。'},
  fbNaphtha:{en:'Surprise! Naphthalene shaves to c1ccc2ccccc2c1 — its own scaffold, neither benzene NOR indole. Same molecule always gives the same bone, but a different bone means a different family. (auto-placed)',
             cn:'意外！萘剃出来是 c1ccc2ccccc2c1——它自成一家，既不是苯环也不是吲哚。同一分子永远剃出同一根骨头，但骨头不同就是另一家。（自动归位）'},
  fbDone:{en:'ALL SORTED! You shaved every molecule to its Bemis-Murcko bone and grouped same-scaffold look-alikes into families. THIS is the key that fixes next lesson\'s leaky score.',
          cn:'全部分类完成！你把每个分子剃到它的 Bemis-Murcko 骨头，把同骨架的近亲归成了家族。这正是下一节修那个泄漏分数的钥匙。'},
  famBenz:{en:'benzene family',cn:'苯环族'},
  famIndo:{en:'indole family',cn:'吲哚族'},
  famNaph:{en:'naphthalene (its own)',cn:'萘（自成一家）'},
  pileBenz:{en:'BENZENE FAMILY · c1ccccc1',cn:'苯环族 · c1ccccc1'},
  pileIndo:{en:'INDOLE FAMILY · c1ccc2[nH]ccc2c1',cn:'吲哚族 · c1ccc2[nH]ccc2c1'},
  lblWhole:{en:'whole molecule',cn:'完整分子'},
  lblScaf:{en:'scaffold (bones)',cn:'骨架（骨头）'},
  lblShaveHint:{en:'press SHAVE',cn:'按「剃骨架」'}
};
function dkey(){return LANG==='zh'?'cn':'en';}
function t(k){return(I18N[k]&&I18N[k][dkey()])||(I18N[k]&&I18N[k]['en'])||k;}
function molName(m){return LANG==='zh'?m.cn:m.id;}

var CSS={};
function buildCSS(){
  var cs=getComputedStyle(document.documentElement);
  var names=['CATALYST','BOND','DEEP','REACTION','YIELD','chem','bg-0','bg-1','bg-2','bg-3','GOOD','BAD','gold','fg','fg-dim','fg-mute','line-strong'];
  var pc=document.createElement('canvas');pc.width=1;pc.height=1;var pctx=pc.getContext('2d');
  names.forEach(function(n){
    var raw=cs.getPropertyValue('--'+n).trim();var key=n.replace(/-/g,'_');
    pctx.clearRect(0,0,1,1);pctx.fillStyle='#000';pctx.fillStyle=raw;pctx.fillRect(0,0,1,1);
    var d=pctx.getImageData(0,0,1,1).data;CSS[key]=[d[0],d[1],d[2]];
  });
}
function rgba(nm,a){var c=CSS[nm.replace(/-/g,'_')];if(!c)return'rgba(200,200,200,'+a+')';return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

var canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),cWrap=document.getElementById('cWrap');
var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){
  var rect=cWrap.getBoundingClientRect();if(rect.width<1||rect.height<1)return;
  W=rect.width;H=rect.height;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
}
function clamp01(x){return x<0?0:x>1?1:x;}
function hex(cx,cy,r){var p=[];for(var k=0;k<6;k++){var a=-Math.PI/2+k*Math.PI/3;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return p;}

/* ── game state ── */
var cur=0;           // selected molecule index
var shaveProg=0;     // 0..1 current shave animation
var shaved=false;    // whether cur is fully shaved (sortable)
var sorted={};       // id -> true
var correct=0;
var sortedCount=0;
var anim=0;          // ambient time for pulse

/* ── drawing primitives ── */
function bond(x1,y1,x2,y2,col,alpha,wd,dbl){
  if(alpha<=0.01)return;ctx.globalAlpha=alpha;ctx.strokeStyle=rgba(col,0.95);ctx.lineWidth=wd||3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(dbl){var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,off=4;ctx.lineWidth=(wd||3)*0.55;
    ctx.beginPath();ctx.moveTo(x1+nx*off+dx*0.18,y1+ny*off+dy*0.18);ctx.lineTo(x2+nx*off-dx*0.18,y2+ny*off-dy*0.18);ctx.stroke();}
  ctx.globalAlpha=1;
}
function atom(x,y,r,fill,ring,alpha,lab){
  if(alpha<=0.01)return;ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=rgba(fill,0.95);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=rgba(ring,0.95);ctx.stroke();
  if(lab){ctx.fillStyle=rgba('bg-0',0.98);ctx.font='700 '+Math.round(r*1.05)+'px "JetBrains Mono",ui-monospace,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,x,y+0.5);}
  ctx.globalAlpha=1;
}
function tagBox(x,y,txt,col,alpha){
  if(alpha<=0.02)return;ctx.globalAlpha=alpha;
  ctx.font='700 '+Math.max(10,Math.min(W*0.0125,15))+'px "JetBrains Mono",ui-monospace,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var tw=ctx.measureText(txt).width,padX=Math.max(7,W*0.009),bh=Math.max(18,W*0.024);
  ctx.fillStyle=rgba('bg-0',0.86);ctx.fillRect(x-tw/2-padX,y-bh/2,tw+padX*2,bh);
  ctx.lineWidth=1.3;ctx.strokeStyle=rgba(col,0.7);ctx.strokeRect(x-tw/2-padX,y-bh/2,tw+padX*2,bh);
  ctx.fillStyle=rgba(col,0.97);ctx.fillText(txt,x,y+1);ctx.globalAlpha=1;
}
function label(x,y,txt,col,alpha,align,sz){
  if(alpha<=0.02)return;ctx.globalAlpha=alpha;
  ctx.font='600 '+(sz||Math.max(10,Math.min(W*0.011,14)))+'px "Noto Sans SC",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=rgba(col,0.95);ctx.fillText(txt,x,y);ctx.globalAlpha=1;
}

/* draw a molecule (benzene-core or indole-core or naphtha) with side chains, shave fades tails */
function drawMol(m,cx,cy,s,shave){
  var leafA=clamp01(1-shave);
  if(m.fam==='benzene'){
    var hv=hex(cx,cy,s);
    for(var i=0;i<6;i++){var a=hv[i],b=hv[(i+1)%6];bond(a[0],a[1],b[0],b[1],'BOND',1,3.2,(i%2===0));}
    // tail from vertex 4
    if(leafA>0.01 && m.sub!=='none'){
      var v4=hv[4];
      var t1=[v4[0]-s*0.9,v4[1]+s*0.5];
      bond(v4[0],v4[1],t1[0],t1[1],'DEEP',leafA,3,false);
      var lab=m.sub==='NH2'?'N':m.sub==='OH'?'O':m.sub==='CH3'?'C':'N';
      atom(t1[0],t1[1],s*0.26,'DEEP','fg-mute',leafA,lab);
      if(m.sub==='amide'){
        var t2=[t1[0]-s*0.55,t1[1]+s*0.6],t3=[t1[0]+s*0.35,t1[1]+s*0.95],o2=[t2[0]-s*0.85,t2[1]-s*0.1];
        bond(t1[0],t1[1],t2[0],t2[1],'DEEP',leafA,3,false);
        bond(t2[0],t2[1],t3[0],t3[1],'DEEP',leafA,3,false);
        bond(t2[0],t2[1],o2[0],o2[1],'DEEP',leafA,3,true);
        atom(t2[0],t2[1],s*0.24,'DEEP','fg-mute',leafA,'C');
        atom(t3[0],t3[1],s*0.24,'DEEP','fg-mute',leafA,'C');
        atom(o2[0],o2[1],s*0.24,'DEEP','fg-mute',leafA,'O');
        // OH off vertex 1
        var v1=hv[1],oh=[v1[0]+s*0.9,v1[1]-s*0.5];
        bond(v1[0],v1[1],oh[0],oh[1],'DEEP',leafA,3,false);
        atom(oh[0],oh[1],s*0.26,'DEEP','fg-mute',leafA,'O');
      }
    }
    for(var j=0;j<6;j++){atom(hv[j][0],hv[j][1],s*0.28,'CATALYST','REACTION',1,'C');}
  } else if(m.fam==='indole'){
    drawIndoleCore(cx,cy,s);
    if(leafA>0.01 && m.tail>0){
      // a short chain hanging off the 5-ring apex
      var ax=cx+s*1.85,ay=cy;
      var c1=[ax+s*0.7,ay+s*0.5],c2=[c1[0]+s*0.6,c1[1]-s*0.4];
      bond(ax,ay,c1[0],c1[1],'DEEP',leafA,3,false);
      bond(c1[0],c1[1],c2[0],c2[1],'DEEP',leafA,3,false);
      atom(c1[0],c1[1],s*0.24,'DEEP','fg-mute',leafA,'C');
      atom(c2[0],c2[1],s*0.24,'DEEP','fg-mute',leafA,m.id==='melatonin'?'N':'C');
    }
  } else {
    // naphthalene: two fused hexagons (its own scaffold, no tails)
    drawNaphtha(cx,cy,s);
  }
}
function drawIndoleCore(cx,cy,s){
  var hv=hex(cx-s*0.5,cy,s*0.9);
  for(var i=0;i<6;i++){var a=hv[i],b=hv[(i+1)%6];bond(a[0],a[1],b[0],b[1],'BOND',1,3,(i%2===0));}
  var p1=hv[1],p2=hv[2];
  var ex=cx+s*1.4,ey1=cy-s*0.55,ey2=cy+s*0.55,apx=cx+s*1.9,apy=cy;
  bond(p1[0],p1[1],ex,ey1,'BOND',1,3,false);
  bond(ex,ey1,apx,apy,'BOND',1,3,false);
  bond(apx,apy,ex,ey2,'BOND',1,3,false);
  bond(ex,ey2,p2[0],p2[1],'BOND',1,3,false);
  for(var j=0;j<6;j++){atom(hv[j][0],hv[j][1],s*0.25,'CATALYST','REACTION',1,'');}
  atom(ex,ey1,s*0.23,'CATALYST','REACTION',1,'');
  atom(apx,apy,s*0.24,'BOND','YIELD',1,'N');
  atom(ex,ey2,s*0.23,'CATALYST','REACTION',1,'');
}
function drawNaphtha(cx,cy,s){
  var h1=hex(cx-s*0.85,cy,s*0.95),h2=hex(cx+s*0.85,cy,s*0.95);
  for(var i=0;i<6;i++){var a=h1[i],b=h1[(i+1)%6];bond(a[0],a[1],b[0],b[1],'BOND',1,2.8,(i%2===0));}
  for(var k=0;k<6;k++){var c=h2[k],d=h2[(k+1)%6];bond(c[0],c[1],d[0],d[1],'BOND',1,2.8,(k%2===1));}
  for(var j=0;j<6;j++){atom(h1[j][0],h1[j][1],s*0.24,'CATALYST','REACTION',1,'');}
  for(var m=0;m<6;m++){atom(h2[m][0],h2[m][1],s*0.24,'CATALYST','REACTION',1,'');}
}

/* draw the bench: workbench (top) + two family piles (bottom) */
function drawBg(){
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,rgba('bg-1',1));grad.addColorStop(1,rgba('bg-0',1));
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=rgba('chem',0.04);ctx.lineWidth=1;var gs=46;
  for(var gx=gs;gx<W;gx+=gs){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(var gy=gs;gy<H;gy+=gs){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
}

function pileRects(){
  var py=H*0.66,ph=H*0.30,gap=W*0.04;
  var pw=(W-gap*3)/2;
  return [
    {key:'benzene',x:gap,y:py,w:pw,h:ph,col:'CATALYST',label:'pileBenz'},
    {key:'indole', x:gap*2+pw,y:py,w:pw,h:ph,col:'YIELD', label:'pileIndo'}
  ];
}

function draw(){
  drawBg();
  var m=MOLS[cur];
  var s=Math.min(W*0.052,H*0.075);
  // ── workbench: current molecule + (if shaved) scaffold ──
  var wx=W*0.28, wy=H*0.27;
  drawMol(m,wx,wy,s,shaveProg);
  label(wx,wy-s*2.4,molName(m)+'  ·  '+(LANG==='zh'?m.heavy+' 重原子':m.heavy+' atoms'),'fg-dim',1,'center',Math.max(11,W*0.011));
  if(shaveProg<0.05){
    tagBox(wx,wy+s*2.5,t('lblShaveHint'),'chem',0.6+0.4*Math.abs(Math.sin(anim*2)));
  }
  // scaffold result panel (appears as shave completes)
  var sres=clamp01((shaveProg-0.55)/0.45);
  if(sres>0.04){
    var rx=W*0.66, ry=H*0.27;
    ctx.globalAlpha=sres*0.6;ctx.strokeStyle=rgba(m.fam==='indole'?'YIELD':m.fam==='naphtha'?'BOND':'CATALYST',0.6);
    ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    ctx.strokeRect(rx-s*2.6,ry-s*2.6,s*5.2,s*5.2);ctx.setLineDash([]);ctx.globalAlpha=1;
    // draw the bare scaffold
    if(m.fam==='benzene'){var hv=hex(rx,ry,s);for(var i=0;i<6;i++){var a=hv[i],b=hv[(i+1)%6];bond(a[0],a[1],b[0],b[1],'CATALYST',sres,3,(i%2===0));}for(var j=0;j<6;j++)atom(hv[j][0],hv[j][1],s*0.28,'CATALYST','REACTION',sres,'C');}
    else if(m.fam==='indole'){ctx.globalAlpha=sres;drawIndoleCore(rx,ry,s);ctx.globalAlpha=1;}
    else {ctx.globalAlpha=sres;drawNaphtha(rx,ry,s);ctx.globalAlpha=1;}
    tagBox(rx,ry-s*2.9,t('lblScaf'),'REACTION',sres);
    tagBox(rx,ry+s*2.9,m.scaf,'gold',sres);
    // arrow
    ctx.globalAlpha=sres;ctx.strokeStyle=rgba('chem',0.6);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(wx+s*2.6,wy);ctx.lineTo(rx-s*2.9,ry);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx-s*2.9,ry);ctx.lineTo(rx-s*2.9-8,ry-5);ctx.lineTo(rx-s*2.9-8,ry+5);ctx.closePath();
    ctx.fillStyle=rgba('chem',0.6);ctx.fill();ctx.globalAlpha=1;
  }
  // ── family piles ──
  var piles=pileRects();
  var ss=Math.min(W*0.026,H*0.038);
  piles.forEach(function(p){
    ctx.fillStyle=rgba(p.col,0.07);ctx.strokeStyle=rgba(p.col,0.5);ctx.lineWidth=2;
    ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h);
    label(p.x+p.w/2,p.y+16,t(p.label),p.col,0.95,'center',Math.max(10,W*0.0105));
    // members already sorted into this pile
    var members=MOLS.filter(function(mm){return sorted[mm.id] && mm.fam===p.key;});
    var perRow=Math.max(3,Math.floor(p.w/(ss*3)));
    members.forEach(function(mm,idx){
      var col=idx%perRow, row=Math.floor(idx/perRow);
      var gx=p.x+p.w*0.5 + (col-(perRow-1)/2)*(ss*2.8);
      var gy=p.y+p.h*0.45 + row*(ss*2.6);
      if(mm.fam==='benzene'){var hv=hex(gx,gy,ss);for(var i=0;i<6;i++){var a=hv[i],b=hv[(i+1)%6];bond(a[0],a[1],b[0],b[1],'CATALYST',0.9,1.8,(i%2===0));}}
      else {ctx.save();ctx.globalAlpha=0.9;drawIndoleCore(gx-ss*0.5,gy,ss*0.85);ctx.restore();}
      label(gx,gy+ss*1.9,molName(mm),'fg-mute',0.85,'center',Math.max(8,W*0.008));
    });
  });
  // sort hint when shaved
  if(shaved){
    label(W*0.5,H*0.585,LANG==='zh'?'↓ 这个骨架属于哪个家族？点下面的归族键 ↓':'↓ Which family shares this scaffold? Click a sort button ↓','chem',0.85,'center',Math.max(11,W*0.0115));
  }
}

/* ── interaction logic ── */
var fb=document.getElementById('feedback');
function setFB(html){fb.innerHTML=html;}
function fillTpl(key,m){
  return t(key).replace('__NAME__',molName(m)).replace('__H__',m.heavy).replace('__SCAF__',m.scaf)
    .replace('__SH__',m.scafHeavy).replace('__FAM__',m.fam==='benzene'?t('famBenz'):m.fam==='indole'?t('famIndo'):t('famNaph'));
}

function selectMol(i){
  cur=i;shaveProg=0;shaved=false;
  document.getElementById('molName').textContent=molName(MOLS[i])+(sorted[MOLS[i].id]?(LANG==='zh'?' 已分':' done'):'');
  document.getElementById('hV3').textContent='--';
  setFB(t('fbStart'));
  updateSortBtns();
}
var shaveAnimId=null;
function doShave(){
  if(shaved)return;
  if(shaveAnimId)cancelAnimationFrame(shaveAnimId);
  var st=null;
  function step(ts){
    if(st===null)st=ts;var e=(ts-st)/700;
    shaveProg=clamp01(e);
    if(shaveProg<1){shaveAnimId=requestAnimationFrame(step);}
    else{
      shaved=true;var m=MOLS[cur];
      document.getElementById('hV3').textContent=m.scaf;
      if(m.fam==='naphtha'){
        // auto-place: naphthalene has its own scaffold, not in the two piles
        setFB('<span class="bad">[!]</span> '+t('fbNaphtha'));
        markSorted(m,true,true);
      } else {
        setFB(fillTpl('fbShaved',m));
      }
      updateSortBtns();
    }
  }
  shaveAnimId=requestAnimationFrame(step);
}
function trySort(fam){
  var m=MOLS[cur];
  if(!shaved){setFB('<span class="bad">!</span> '+t('fbSortFirst'));return;}
  if(sorted[m.id])return;
  if(m.fam===fam){
    markSorted(m,true,false);
    setFB('<span class="ok">[OK]</span> '+fillTpl('fbRight',m));
  } else {
    setFB('<span class="bad">[X]</span> '+fillTpl('fbWrong',m));
  }
}
function markSorted(m,ok,auto){
  if(sorted[m.id])return;
  sorted[m.id]=true;sortedCount++;
  if(ok)correct++;
  document.getElementById('hV1').textContent=correct;
  document.getElementById('hV2').textContent=sortedCount+'/'+MOLS.length;
  document.getElementById('progTxt').innerHTML='<b>'+sortedCount+'</b>/'+MOLS.length+' '+t('prog');
  document.getElementById('molName').textContent=molName(m)+(LANG==='zh'?' 已分':' done');
  if(sortedCount>=MOLS.length){
    setTimeout(function(){setFB('<span class="ok">[DONE]</span> '+t('fbDone'));},auto?1400:900);
  }
}
function updateSortBtns(){
  var m=MOLS[cur];
  var canSort=shaved && !sorted[m.id] && m.fam!=='naphtha';
  document.getElementById('benzBtn').disabled=!canSort;
  document.getElementById('indoBtn').disabled=!canSort;
  document.getElementById('shaveBtn').disabled=shaved;
}

/* ── ambient render loop (pulse hint + smooth) ── */
function loop(ts){anim=ts/1000;draw();requestAnimationFrame(loop);}

function refreshI18N(){
  document.getElementById('langBtn').textContent=(LANG==='zh')?'EN':'CN';
  document.getElementById('mascotLine').textContent=t('mascotLine');
  document.getElementById('sTitle').textContent=t('sTitle');
  document.getElementById('sGoalLabel').textContent=t('sGoalLabel');
  document.getElementById('sGoal').innerHTML='<li>'+t('goal1')+'</li><li>'+t('goal2')+'</li><li>'+t('goal3')+'</li>';
  document.getElementById('hL1').textContent=t('hL1');
  document.getElementById('hL2').textContent=t('hL2');
  document.getElementById('hL3').textContent=t('hL3');
  document.getElementById('titleH').textContent=t('titleH');
  document.getElementById('pickLabel').textContent=t('pickLabel');
  document.getElementById('shaveBtn').textContent=t('shaveBtn');
  document.getElementById('benzBtn').textContent=t('benzBtn');
  document.getElementById('indoBtn').textContent=t('indoBtn');
  document.getElementById('progTxt').innerHTML='<b>'+sortedCount+'</b>/'+MOLS.length+' '+t('prog');
  document.getElementById('molName').textContent=molName(MOLS[cur])+(sorted[MOLS[cur].id]?(LANG==='zh'?' 已分':' done'):'');
}

document.getElementById('langBtn').addEventListener('click',function(){LANG=(LANG==='zh')?'en':'zh';refreshI18N();});
document.getElementById('molSlider').addEventListener('input',function(e){selectMol(parseInt(e.target.value,10));});
document.getElementById('shaveBtn').addEventListener('click',doShave);
document.getElementById('benzBtn').addEventListener('click',function(){trySort('benzene');});
document.getElementById('indoBtn').addEventListener('click',function(){trySort('indole');});
window.addEventListener('resize',resize);

buildCSS();resize();
setTimeout(resize,200);setTimeout(resize,600);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){resize();});}
refreshI18N();
selectMol(0);
requestAnimationFrame(loop);
})();
</script>
